[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MatheusWith/rustode"

[workspace.dependencies]
rustode-config = { path = "crates/config" }
rustode-core = { path = "crates/core" }
rustode-fs = { path = "crates/fs" }
rustode-syntax = { path = "crates/syntax" }
rustode-trace = { path = "crates/trace" }
rustode-workspace = { path = "crates/workspace" }
# Micro-benchmarks (ADR 0026): no plotters and no rayon; the gate reads the
# estimates, not the charts.
criterion = { version = "0.8.2", default-features = false }
# GUI: eframe on wgpu (no glow) with AccessKit. winit is the version eframe
# uses; the GUI wraps eframe's event handler to time input-to-present.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "wayland", "wgpu", "x11"] }
egui_kittest = { version = "0.36.2", features = ["eframe", "snapshot", "wgpu"] }
encoding_rs = "0.8"
# Search include and exclude globs; already in the graph through ignore.
globset = { version = "0.4.21", default-features = false }
ignore = "0.4.34"
notify = "8.2.2"
# Only CR, LF and CRLF end lines, as in VS Code (no Unicode line separators).
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
regex = "1.13.1"
# Extension management (Open VSX): HTTPS through rustls on ring, trusting the
# system's root certificates. Not ureq's `rustls` feature: it pulls
# webpki-roots, whose CDLA-Permissive-2.0 license deny.toml does not allow.
rustls-native-certs = "0.8.5"
sha2 = { version = "0.10.9", default-features = false }
ureq = { version = "3.5.2", default-features = false, features = ["_ring", "rustls-no-provider"] }
# VSIX files are zip archives compressed with deflate (zlib-rs backend).
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: JSON objects keep their key order, so extension manifests
# are rewritten with their fields in place and `extensions.json` is written
# in VS Code's key order (ADR 0029).
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
# Syntax: the Tree-sitter runtime (C, built with cc) and the Rust grammar,
# whose highlight query rustode-syntax uses as is.
tree-sitter = { version = "0.27.2", default-features = false, features = ["std"] }
tree-sitter-rust = "0.24.2"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-md = { version = "0.5.4", default-features = false }
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-yaml = "0.7.2"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
unicode-width = "0.2.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std", "tracing-log"] }
# Client-side decorations without a title font (sctk-adwaita without
# ab_glyph): ab_glyph pulls the unmaintained ttf-parser (RUSTSEC-2026-0192).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-csd-adwaita-notitle", "wayland-dlopen", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
