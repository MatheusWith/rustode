[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/MatheusWith/rustode"

[workspace.dependencies]
rustode-config = { path = "crates/config" }
rustode-core = { path = "crates/core" }
rustode-fs = { path = "crates/fs" }
rustode-trace = { path = "crates/trace" }
rustode-workspace = { path = "crates/workspace" }
encoding_rs = "0.8"
notify = "8.2.2"
# Only CR, LF and CRLF end lines, as in VS Code (no Unicode line separators).
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde_json = "1.0.154"
tracing = "0.1.44"
unicode-width = "0.2.3"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "json", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
