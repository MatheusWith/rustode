# cargo deny: licenses compatible with MIT, advisories, bans and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Owner decision, 2026-11-17: the GUI's screen-reader support (AccessKit on
# Linux, through accesskit_unix and atspi) still uses zbus 5, whose split-out
# crates are marked unmaintained because zbus 6 merged them back. They are
# informational: no vulnerability, no patched version. Even eframe 0.37,
# accesskit_unix 0.24.1 and atspi 0.30 still use zbus 5.19. Remove these
# entries when accesskit_unix moves to zbus 6; keep .cargo/audit.toml in step.
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; needed by accesskit_unix (zbus 5) until it migrates" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; needed by accesskit_unix (zbus 5) until it migrates" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; needed by accesskit_unix (zbus 5) until it migrates" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# the list is the policy for future crates, so licenses not used yet are fine
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
