version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # eframe, egui_kittest and the egui crates must move together: one of
      # them alone puts two egui versions in the graph and the GUI stops
      # compiling (PRs #5 and #6). Dependabot sees 0.x minor bumps as major,
      # so this group takes every update type.
      egui:
        patterns: ["eframe", "egui*", "epaint*", "emath", "ecolor"]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
