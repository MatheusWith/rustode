# Repeats every local hook (CONTRIBUTING.md) on Linux x64, plus coverage and advisories.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rustflags: -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-audit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo xtask coverage

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --redact --no-banner .
      - name: semgrep (project rules)
        run: |
          pipx install semgrep
          semgrep scan --test --config .semgrep/rust.yml .semgrep/rust.rs --metrics=off --disable-version-check
          semgrep scan --config .semgrep --metrics=off --disable-version-check --error .

  conventions:
    # Dependabot titles and branches follow its own format (prefix configured in dependabot.yml).
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: committed
      - name: pull request title (becomes the squash commit)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/title"
          cargo xtask commit-msg "$RUNNER_TEMP/title"
          committed --commit-file "$RUNNER_TEMP/title"
      - name: branch name and every commit message
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'refs/heads/%s %s refs/heads/%s %s\n' "$HEAD_REF" "$HEAD_SHA" "$HEAD_REF" "$BASE_SHA" | cargo xtask pre-push
          committed --no-merge-commit "$BASE_SHA..$HEAD_SHA"
