[package]
name = "rustode-workspace"
description = "rustode workspace crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rustode-config.workspace = true
rustode-core.workspace = true
rustode-fs.workspace = true
rustode-syntax.workspace = true
rustode-trace.workspace = true
globset.workspace = true
regex.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
ureq.workspace = true
zip.workspace = true

[features]
# The local Open VSX stand-in (`extensions::stand_in`), for tests only:
# frontends enable it in their dev-dependencies, so it never ships.
stand-in = []

[dev-dependencies]
# The crate's own tests use the stand-in too.
rustode-workspace = { path = ".", features = ["stand-in"] }

[lints]
workspace = true
